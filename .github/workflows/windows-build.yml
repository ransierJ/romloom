name: Windows bundle

# Builds the standalone Windows executable with PyInstaller. Run it by hand from
# the Actions tab (workflow_dispatch) to get a downloadable artifact, or push a
# v* tag to also attach romloom.exe to the matching GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to attach the exe to a release on tag builds

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The compiled frontend (backend/static) is not committed, so build it
      # here before packaging.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build        # vite outputs to ../backend/static

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build romloom.exe
        working-directory: backend
        run: pyinstaller romloom.spec

      - name: Stage bundle
        working-directory: backend
        shell: bash
        run: |
          mkdir -p out
          cp dist/romloom.exe out/
          cp romloom.toml.example out/romloom.toml
          cp ../README.md out/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: romloom-windows
          path: backend/out/*

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/romloom.exe
