name: Docker image

# Builds the ROMLoom Docker image and pushes it to GHCR.
#
#   push to main   -> ghcr.io/<owner>/romloom:main  (+ :main-<sha>)   bleeding edge
#   push a v* tag  -> :1.2.3  :1.2  and :latest                       a release
#   manual run     -> whatever ref you dispatch it on
#
# The NAS pulls :latest, which tracks the most recent v* release — not every
# main push — so a WIP commit to main never moves what production gets.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the owner (ransierJ -> ransierj) and derives the tag set.
      # flavor latest=auto tags :latest only on a v* (semver) build, never on main.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/romloom
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
